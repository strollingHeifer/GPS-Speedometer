  <!-- Threshold Marker Dot -->
  <circle cx="147" cy="68" r="6" fill="#ffdad6" stroke="#ba1a1a" stroke-width="2.5" />
  <!-- Needle / Vector Pointer -->
  <g transform="translate(96, 102) rotate(36)">
