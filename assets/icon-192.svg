<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006874" />
      <stop offset="100%" stop-color="#004f58" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8cf7c6" />
      <stop offset="60%" stop-color="#97f0ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="44" fill="url(#bgGrad)" />
  <!-- Background Track Arc -->
  <path d="M 42 138 A 66 66 0 1 1 150 138" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="14" stroke-linecap="round" />
  <!-- Active Velocity Arc -->
