    <circle cx="0" cy="0" r="10" fill="#97f0ff" />
  </g>
  <!-- Bottom Label Pill -->
  <rect x="64" y="144" width="64" height="22" rx="11" fill="rgba(0,31,36,0.45)" />
  <text x="96" y="159" text-anchor="middle" fill="#97f0ff" font-family="sans-serif" font-weight="700" font-size="12" letter-spacing="1">GNSS</text>
